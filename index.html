<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="높이 1,609m 초고층 타워와 방사형 계획도시를 브라우저에서 실시간으로 탐험하는 3D 개념 설계. 태양 궤적, 날씨, 단면, 1인칭, 익스프레스 셔틀.">
<meta name="theme-color" content="#0d1522">
<meta property="og:type" content="website">
<meta property="og:title" content="1마일 타워 지구">
<meta property="og:description" content="높이 1,609m 초고층 타워와 방사형 계획도시 · 실시간 3D">
<meta property="og:image" content="docs/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1마일 타워">
<meta name="mobile-web-app-capable" content="yes">
<title>1마일 타워 지구 조감도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2530;--muted:#56616d;--paper:rgba(244,246,245,.84);--line:rgba(28,37,48,.14);--accent:#2f5f86;--on-accent:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e5eaef;--muted:#9ba7b3;--paper:rgba(16,22,30,.78);--line:rgba(229,234,239,.16);--accent:#8fb9dc;--on-accent:#0f1b26}}
:root[data-theme="dark"]{--ink:#e5eaef;--muted:#9ba7b3;--paper:rgba(16,22,30,.78);--line:rgba(229,234,239,.16);--accent:#8fb9dc;--on-accent:#0f1b26}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;overflow:hidden;background:#0d1522;color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--paper);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
#title{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:11px 16px 12px 14px;max-width:calc(100% - 24px)}
#title h1{margin:0;font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.25}
#title p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
#hint.gone{display:none}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:max-content;max-width:calc(100% - 20px)}
.seg{display:flex;align-items:center;padding:4px;gap:2px}
.seg span{font-size:12px;color:var(--muted);padding:0 6px 0 8px;white-space:nowrap}
button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:8px 11px;min-height:36px;border-radius:10px;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;font-size:14px}


#bar{flex-direction:column;align-items:stretch;gap:6px;width:min(420px,calc(100% - 20px))}
#panes{padding:8px 10px}
.pane .row{display:flex;align-items:center;gap:8px}
.pane .row+.row{margin-top:6px}
.chips{flex-wrap:wrap;justify-content:center}
.chips button{flex:1 1 auto;padding:7px 10px;border:1px solid var(--line)}
#tabs{justify-content:space-between}
#tabs button{flex:1}
#hour{flex:1;accent-color:var(--accent);height:28px}
#clock{font-variant-numeric:tabular-nums;font-size:15px;min-width:46px;text-align:right}
#play{min-width:40px;border:1px solid var(--line)}
#elPrompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 230px);pointer-events:auto;padding:4px}
#fpUI:not(.touch) #elPrompt{bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#elPanel{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(380px,calc(100% - 24px));padding:10px;pointer-events:auto}
#elInfo{font-size:14px;font-variant-numeric:tabular-nums;margin-bottom:8px;text-align:center}
#elStops{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-height:38vh;overflow:auto}
#elStops button{font-size:13px;padding:6px 8px;border:1px solid var(--line);text-align:left}
#elPanel .row{display:flex;gap:6px;margin-top:8px}#elPanel .row button{flex:1;border:1px solid var(--line)}
#elFast.on{background:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.45}
#fpUI.riding .pad,#fpUI.riding #fpHelp,#fpUI.riding #cross{display:none!important}
[hidden]{display:none!important}
#fpUI{position:fixed;inset:0;pointer-events:none;z-index:5}
#fpUI[hidden]{display:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.9}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{left:0;top:10px;width:22px;height:2px}
#fpTop{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;
  flex-wrap:wrap;justify-content:flex-end;gap:4px;row-gap:4px;padding:4px;pointer-events:auto;max-width:calc(100vw - 24px)}
#fpInfo{font-size:13px;color:var(--muted);padding:0 8px;white-space:nowrap}
#fpSpeed{display:flex;align-items:center;gap:2px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 2px;margin:0 2px}
#fpSpeed button{min-width:32px;padding:6px 4px;font-size:16px;line-height:1}
#fpSpeedVal{font-size:13px;font-variant-numeric:tabular-nums;min-width:38px;text-align:center;color:var(--ink)}
#fpHelp{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);transition:opacity .8s;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted);max-width:260px;pointer-events:none}
#fpUI.touch #fpHelp .desk{display:none}#fpUI:not(.touch) #fpHelp .mob{display:none}
.pad{position:absolute;display:none;pointer-events:auto;touch-action:none}
#fpUI.touch .pad{display:grid}
#dpad{left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
#acts{right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:10px}
.pad button{background:rgba(20,26,34,.42);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:12px;font-size:18px;min-height:0;padding:0;-webkit-user-select:none;user-select:none}
.pad button.on{background:rgba(143,185,220,.6)}
#acts button{border-radius:50%;font-size:13px}

/* Touch. 36px is a comfortable mouse target and a frustrating finger one, so
   anything tapped grows to the 44px both platforms ask for. The on-screen pad
   is already sized for thumbs and is left alone. */
@media (pointer: coarse){
  button{min-height:44px;padding:10px 13px}
  #fpSpeed button{min-width:44px}
  .pad button{min-height:0}
  #play{min-width:48px}
  #elStops button{min-height:40px}
}
/* Narrow phones: the altitude readout is what pushes this bar off-screen. */
@media (max-width:430px){
  #fpInfo{font-size:12px;padding:0 6px}
  #fpTop{gap:3px;right:8px}
}
#err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 18px;max-width:min(420px,calc(100vw - 32px));font-size:14px;line-height:1.6}
#err p{margin:0 0 8px}#err p:last-of-type{margin-bottom:0}
#errHint{color:var(--muted);font-size:13px}#errHint:empty{display:none}
#errDetail{margin:10px 0 0;padding:9px 11px;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:8px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto;-webkit-user-select:all;user-select:all}
#loadStep{color:var(--muted)}
</style>
</head>
<body>
<noscript><div style="padding:24px;font-family:sans-serif;color:#fff">이 페이지는 JavaScript와 WebGL이 필요합니다.</div></noscript>
<canvas id="c" aria-label="1마일 타워와 방사형 계획도시의 3D 조감도"></canvas>
<div id="title" class="panel">
  <h1>1마일 타워 지구</h1>
  <p>타워를 중심으로 한 방사형 계획도시, 반경 4.7km</p>
  <p id="hint">한 손가락 시선 회전 · 두 손가락 끌어서 이동 · 핀치 확대</p>
</div>
<div id="bar" hidden>
  <div id="panes" class="panel">
    <div class="pane" data-pane="time">
      <div class="row">
        <button id="play" aria-label="재생" aria-pressed="false">▶</button>
        <input id="hour" type="range" min="0" max="24" step="0.01" value="13" aria-label="시각">
        <span id="clock">13:00</span>
      </div>
      <div class="row chips">
        <button data-hourp="sunrise">일출</button><button data-hourp="noon">정오</button><button data-hourp="sunset">일몰</button><button data-hourp="night">밤</button>
      </div>
    </div>
    <div class="pane" data-pane="weather" hidden>
      <div class="row chips"><button data-wx="clear" aria-pressed="true">맑음</button><button data-wx="rain" aria-pressed="false">비</button><button data-wx="fog" aria-pressed="false">안개</button></div>
    </div>
    <div class="pane" data-pane="view" hidden>
      <div class="row chips">
        <button data-view="bird" aria-pressed="true">조감</button><button data-view="plan" aria-pressed="false">도시</button><button data-view="ground" aria-pressed="false">광장</button><button data-view="street" aria-pressed="false">거리</button><button data-view="top" aria-pressed="false">정상부</button>
      </div>
    </div>
    <div class="pane" data-pane="tools" hidden>
      <div class="row chips"><button id="cmp" aria-pressed="false">높이 비교</button><button data-section aria-pressed="false">단면</button><button data-fp aria-pressed="false">1인칭</button></div>
    </div>
  </div>
  <div id="tabs" class="panel seg" role="tablist">
    <button data-tab="time" aria-pressed="true">시간</button><button data-tab="weather" aria-pressed="false">날씨</button><button data-tab="view" aria-pressed="false">시점</button><button data-tab="tools" aria-pressed="false">도구</button>
  </div>
</div>
<div id="fpUI" hidden>
  <div id="cross"></div>
  <div id="fpTop" class="panel">
    <span id="fpInfo">걷기</span>
    <div id="fpSpeed" role="group" aria-label="이동 속도">
      <button id="fpSlower" aria-label="느리게">−</button>
      <span id="fpSpeedVal" aria-live="polite">1.0×</span>
      <button id="fpFaster" aria-label="빠르게">+</button>
    </div>
    <button id="fpTime">시간</button><button id="fpExit">나가기</button>
  </div>
  <div id="fpHelp" class="panel">
    <div class="desk">클릭: 마우스 잠금 · WASD 이동<br>Space 점프 · 두 번: 비행<br>Shift 웅크리기·하강 · Ctrl 달리기<br>[ ] 또는 휠: 이동 속도<br>F5 / V 시점 전환 · Esc 해제</div>
    <div class="mob">화면 끌기: 시선 · 방향키: 이동<br>점프 두 번: 비행 · 누르고 있기: 상승<br>상단 −/+ : 이동 속도</div>
  </div>
  <div id="elPrompt" class="panel" hidden><button id="elCall">셔틀 탑승 (E)</button></div>
  <div id="elPanel" class="panel" hidden>
    <div id="elInfo">로비</div>
    <div id="elStops"></div>
    <div class="row"><button id="elFast">빠르게 ≫ (F)</button><button id="elExit">내리기 (E)</button></div>
  </div>
  <div id="dpad" class="pad">
    <span></span><button data-k="f" aria-label="앞으로">▲</button><span></span>
    <button data-k="l" aria-label="왼쪽">◀</button><button data-toggle="sneak" aria-label="웅크리기">●</button><button data-k="r" aria-label="오른쪽">▶</button>
    <span></span><button data-k="b" aria-label="뒤로">▼</button><span></span>
  </div>
  <div id="acts" class="pad">
    <button data-k="sprintBtn">달리기</button><button data-k="jump">점프</button>
    <button data-k="sneak">하강</button><span></span>
  </div>
</div>
<div id="loading" class="panel">도시를 짓는 중<span id="loadStep"></span></div>
<div id="err" class="panel" hidden>
  <p id="errMsg">이 기기에서 3D를 표시할 수 없습니다.</p>
  <p id="errHint"></p>
  <pre id="errDetail" hidden></pre>
</div>

<!--
  A classic script, deliberately: it has to run even when the module below
  never loads. Opening this file over file:// blocks the module for CORS, and
  without this the page sits on "도시를 짓는 중" forever with nothing in the UI
  to say why.
-->
<script>
(function(){
  var err = document.getElementById('err');
  var msg = document.getElementById('errMsg');
  var hint = document.getElementById('errHint');
  var detail = document.getElementById('errDetail');

  function show(title, advice, text) {
    var loading = document.getElementById('loading');
    if (loading) loading.hidden = true;
    msg.textContent = title;
    hint.textContent = advice || '';
    if (text) { detail.textContent = text; detail.hidden = false; }
    err.hidden = false;
  }
  window.__fail = show;

  if (location.protocol === 'file:') {
    show('로컬 파일로는 실행할 수 없습니다.',
         '브라우저가 file:// 에서 모듈 스크립트를 차단합니다. 폴더에서 다음을 실행한 뒤 http://localhost:8000 을 여세요.',
         'python3 -m http.server 8000');
    return;
  }

  // Offline support. Needs a secure context — https, or localhost.
  //
  // Not in development, though. The worker serves cache-first, which is right
  // for a deployed build and actively harmful while one is being edited: the
  // page keeps handing back the bundle it cached first and every rebuild looks
  // like it did nothing. On localhost we tear down any worker and cache a
  // previous visit left behind, so a reload means a reload.
  var DEV = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    if (DEV) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        var had = rs.length > 0;
        rs.forEach(function (r) { r.unregister(); });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        if (had) { console.info('개발 모드: 서비스 워커를 해제했습니다. 한 번 더 새로고침하세요.'); }
      }).catch(function () {});
    } else {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.info('offline cache unavailable:', e && e.message);
        });
      });
    }
  }

  // A module that fails to parse or resolve fires window.onerror with nothing
  // useful, so say what actually tends to be wrong.
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      show('앱을 불러오지 못했습니다.',
           'dist/app.js 를 찾을 수 없습니다. npm run build 를 실행했는지 확인해 주세요.',
           e.target.src || '');
    }
  }, true);
})();
</script>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
